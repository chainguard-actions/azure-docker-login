name: Test credentials are written to config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          username: wronguser
          password: wrongpassword
          login-server: someregistry.example.com

      - name: Assert DOCKER_CONFIG is set
        run: |
          echo "DOCKER_CONFIG: $DOCKER_CONFIG"
          if [ -z "$DOCKER_CONFIG" ]; then
            echo "FAIL: DOCKER_CONFIG env var is not set"
            exit 1
          fi
          echo "PASS: DOCKER_CONFIG is set"

      - name: Assert config file is valid JSON with auths section
        run: |
          CONFIG_FILE="$DOCKER_CONFIG/config.json"
          echo "Config file contents:"
          cat "$CONFIG_FILE"

          # Verify it's valid JSON
          if ! python3 -c "import json, sys; json.load(open('$CONFIG_FILE'))" 2>/dev/null; then
            echo "FAIL: Config file is not valid JSON"
            exit 1
          fi

          # Verify auths section exists
          if ! cat "$CONFIG_FILE" | grep -q '"auths"'; then
            echo "FAIL: Config file does not contain 'auths' section"
            exit 1
          fi

          # Verify the registry is present
          if ! cat "$CONFIG_FILE" | grep -q "someregistry.example.com"; then
            echo "FAIL: Config file does not contain the expected registry"
            exit 1
          fi

          # Verify auth token is base64 of wronguser:wrongpassword
          EXPECTED_AUTH=$(echo -n "wronguser:wrongpassword" | base64)
          echo "Expected auth token: $EXPECTED_AUTH"
          if ! cat "$CONFIG_FILE" | grep -q "$EXPECTED_AUTH"; then
            echo "FAIL: Config file does not contain the expected auth token"
            exit 1
          fi

          echo "PASS: Config file is valid JSON with correct auths section"
