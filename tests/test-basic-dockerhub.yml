name: Test basic Docker Hub login
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          username: testuser
          password: testpassword
          login-server: https://index.docker.io/v1/

      - name: Assert DOCKER_CONFIG is set and config file exists
        run: |
          echo "DOCKER_CONFIG: $DOCKER_CONFIG"
          if [ -z "$DOCKER_CONFIG" ]; then
            echo "FAIL: DOCKER_CONFIG env var is not set"
            exit 1
          fi
          CONFIG_FILE="$DOCKER_CONFIG/config.json"
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "FAIL: Docker config file not found at $CONFIG_FILE"
            exit 1
          fi
          echo "PASS: DOCKER_CONFIG is set and config.json exists"

      - name: Assert config file contains correct registry and credentials
        run: |
          CONFIG_FILE="$DOCKER_CONFIG/config.json"
          echo "Config file contents:"
          cat "$CONFIG_FILE"

          # Check registry is present
          if ! cat "$CONFIG_FILE" | grep -q "index.docker.io"; then
            echo "FAIL: Config file does not contain the expected registry"
            exit 1
          fi

          # Check auth token is base64 of testuser:testpassword
          EXPECTED_AUTH=$(echo -n "testuser:testpassword" | base64)
          echo "Expected auth token: $EXPECTED_AUTH"
          if ! cat "$CONFIG_FILE" | grep -q "$EXPECTED_AUTH"; then
            echo "FAIL: Config file does not contain the expected auth token"
            exit 1
          fi

          echo "PASS: Config file contains correct registry and credentials"
